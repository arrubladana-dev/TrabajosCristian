<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/styleRegistro.css}">
    <title>Registro de Usuario</title>
</head>
<body>
    <h2>Registrar Nuevo Usuario</h2>
    
    
    <form th:action="@{/create}" th:object="${usuarioRegistro}" method="post">
        
        <label>Nombre:</label>
        <input type="text" th:field="*{name}" required /><br/><br/>
        
        <label>Apellido:</label>
        <input type="text" th:field="*{lastName}" required /><br/><br/>
        
        <label>Edad:</label>
        <input type="number" th:field="*{age}" required /><br/><br/>
        
        <label>Sexo:</label>
        <input type="text" th:field="*{sex}" required /><br/><br/>
        
        <label>Correo:</label>
        <input type="email" th:field="*{email}" required /><br/><br/>
        
        <button type="submit">Guardar Usuario</button>
    </form>
</body>
</html>
